glob_matcher: doublestar

pre-commit:
  parallel: false
  commands:
    ultracite:
      priority: 1
      glob: "**/*.{js,jsx,ts,tsx,json,jsonc,css,scss,md,mdx}"
      run: bun x ultracite fix "{staged_files}"
      stage_fixed: true

    eslint:
      priority: 2
      glob: "apps/web/src/**/*.{js,jsx,ts,tsx}"
      exclude:
        - "apps/web/src/**/routeTree.gen.ts"
      run: bun x eslint --fix "{staged_files}"
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bun x commitlint --edit "{1}"
