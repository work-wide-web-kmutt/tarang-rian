glob_matcher: doublestar

pre-commit:
  parallel: false
  commands:
    oxfmt:
      priority: 1
      glob: "**/*.{js,jsx,ts,tsx,json,jsonc,css,scss,md,mdx}"
      run: bun x oxfmt --config oxfmt.config.ts --write "{staged_files}"
      stage_fixed: true

    oxlint:
      priority: 2
      glob: "**/*.{js,jsx,ts,tsx}"
      exclude:
        - "apps/web/src/**/routeTree.gen.ts"
      run: bun x oxlint --config oxlint.config.ts --fix "{staged_files}"
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: bun x commitlint --edit "{1}"
